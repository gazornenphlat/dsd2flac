[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsd2flac-gui"
version = "1.0"
description = "Convert DSF and DFF (DSD) recordings to FLAC, with a Windows window"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "soundfile>=0.12",
    "mutagen>=1.47",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.gui-scripts]
DSD2FLAC = "main:run"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["main", "gui", "converter", "dsd_reader", "original_taps"]
